<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>德扑之夜 · 角色动画预演</title>
  <style>
    :root { color-scheme: dark; --gold:#d9b977; --cream:#f4ecdd; --muted:#9b958a; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#070b0d; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    #stage { position:fixed; inset:0; }
    .top { position:fixed; left:28px; top:24px; z-index:2; pointer-events:none; }
    .kicker { color:var(--gold); font-size:10px; letter-spacing:.3em; }
    h1 { margin:5px 0 4px; font-family:Georgia,"Songti SC",serif; font-size:27px; font-weight:400; letter-spacing:.08em; color:var(--cream); }
    .sub { color:var(--muted); font-size:11px; letter-spacing:.08em; }
    .credit { position:fixed; right:26px; top:26px; z-index:2; color:rgba(244,236,221,.42); font-size:9px; letter-spacing:.1em; text-align:right; }
    .controls { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:3; display:flex; gap:7px; padding:7px; border:1px solid rgba(217,185,119,.18); border-radius:999px; background:rgba(8,12,14,.68); backdrop-filter:blur(16px); }
    .controls button { min-height:30px; padding:0 13px; border:1px solid rgba(244,236,221,.1); border-radius:999px; background:rgba(255,255,255,.03); color:rgba(244,236,221,.62); font-size:10px; letter-spacing:.06em; cursor:pointer; }
    .controls button:hover,.controls button.active { border-color:rgba(217,185,119,.55); color:#ffe9b9; background:rgba(217,185,119,.12); }
    .legend { position:fixed; left:28px; bottom:28px; z-index:2; color:rgba(244,236,221,.35); font-size:9px; line-height:1.8; }
    .legend b { color:rgba(244,236,221,.66); font-weight:500; }
    .loading { position:fixed; inset:0; display:grid; place-items:center; z-index:9; background:#070b0d; color:var(--gold); font-size:11px; letter-spacing:.2em; transition:opacity .5s; }
    .loading.done { opacity:0; pointer-events:none; }
    @media (max-width:800px) { .top{left:16px;top:15px} h1{font-size:21px} .credit{right:14px;top:16px} .controls{bottom:15px} .legend{display:none} }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="top">
    <div class="kicker">DEZHOU NIGHT · CHARACTER LAB</div>
    <h1>角色动画预演</h1>
    <div class="sub">Kenney Mini Characters · 32 段骨骼动画 · CC0</div>
  </div>
  <div class="credit">MODEL / ANIMATION SPIKE<br />KENNEY.NL · CC0</div>
  <div class="controls" id="controls">
    <button data-anim="idle" class="active">全体待机</button>
    <button data-anim="emote-yes">点头</button>
    <button data-anim="emote-no">摇头</button>
    <button data-anim="interact-right">互动</button>
    <button data-anim="sit">坐下</button>
    <button data-anim="emote-yes">再点头</button>
  </div>
  <div class="legend">
    <b>6 个可替换角色</b><br />
    每个模型约 1.2k 顶点 / 32 个动画<br />
    正在验证：Idle、Emote、Interact、Sit
  </div>
  <div class="loading" id="loading">LOADING CHARACTERS…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071013);
    scene.fog = new THREE.FogExp2(0x071013, 0.055);
    const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
    camera.position.set(0, 2.65, 7.1);

    // floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5.5, 96),
      new THREE.MeshStandardMaterial({ color:0x12352e, roughness:0.72, metalness:0.08 })
    );
    floor.rotation.x = -Math.PI/2; floor.position.y = -0.02; floor.receiveShadow = true; scene.add(floor);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.15, 2.19, 128),
      new THREE.MeshBasicMaterial({ color:0xd9b977, transparent:true, opacity:0.45, side:THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.005; scene.add(ring);

    // table
    const felt = new THREE.Mesh(
      new THREE.CircleGeometry(1.52, 80),
      new THREE.MeshStandardMaterial({ color:0x2d6f52, roughness:0.92 })
    );
    felt.rotation.x = -Math.PI/2; felt.position.y = 0.62; felt.receiveShadow = true; scene.add(felt);
    const rail = new THREE.Mesh(
      new THREE.TorusGeometry(1.56, 0.055, 12, 96),
      new THREE.MeshStandardMaterial({ color:0x8a674b, roughness:0.45, metalness:0.15 })
    );
    rail.rotation.x = Math.PI/2; rail.scale.y = 0.68; rail.position.y = 0.66; scene.add(rail);
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.62, 0.7, 40),
      new THREE.MeshStandardMaterial({ color:0x3d2a1e, roughness:0.7 })
    );
    pedestal.position.y = 0.32; pedestal.castShadow = true; scene.add(pedestal);

    // lights
    scene.add(new THREE.HemisphereLight(0xcfe4e4, 0x3a2418, 2.0));
    const fill = new THREE.DirectionalLight(0xfff2dd, 1.7); fill.position.set(-2, 4, 5); scene.add(fill);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.SpotLight(0xffd6a0, 30, 10, 0.65, 0.72, 1.5);
    key.position.set(0, 4.2, 1.6); key.target.position.set(0, 0.9, 0); key.castShadow = true; key.shadow.mapSize.set(1024,1024); scene.add(key, key.target);
    const rim = new THREE.PointLight(0x77c8ff, 14, 8, 2); rim.position.set(-2.8, 2.2, -2.2); scene.add(rim);
    const warm = new THREE.PointLight(0xff7c44, 10, 7, 2); warm.position.set(2.7, 1.6, 1.8); scene.add(warm);

    // subtle dust
    const dustGeo = new THREE.BufferGeometry();
    const dust = new Float32Array(90*3);
    for (let i=0;i<90;i++){ dust[i*3]=(Math.random()-.5)*8; dust[i*3+1]=Math.random()*3.2; dust[i*3+2]=(Math.random()-.5)*6; }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dust,3));
    scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0xffd9a0, size:0.012, transparent:true, opacity:0.45, depthWrite:false })));

    const models = [
      { file:'character-male-a.glb', name:'阿凯', angle:-Math.PI/2 + 0.1 },
      { file:'character-male-b.glb', name:'沈爷', angle:-Math.PI/2 + 1.05 },
      { file:'character-female-a.glb', name:'苏小姐', angle:-Math.PI/2 + 2.1 },
      { file:'character-female-b.glb', name:'小满', angle:-Math.PI/2 + 3.15 },
      { file:'character-male-c.glb', name:'牛头', angle:-Math.PI/2 + 4.2 },
      { file:'character-female-c.glb', name:'阿紫', angle:-Math.PI/2 + 5.25 },
    ];
    const loader = new GLTFLoader();
    const actors = [];
    const animations = new Map();
    const clock = new THREE.Clock();
    let activeAction = 'idle';

    function loadModel(entry, index) {
      return new Promise((resolve) => {
        loader.load(`/public/models/kenney/${entry.file}`, (gltf) => {
          const root = gltf.scene;
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          const scale = 1.58 / Math.max(0.001, size.y);
          root.scale.setScalar(scale);
          root.updateMatrixWorld(true);
          const box2 = new THREE.Box3().setFromObject(root);
          const center = box2.getCenter(new THREE.Vector3());
          root.position.set(0, -box2.min.y, 0);
          root.position.y += 0.0;
          root.traverse((obj) => {
            if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; obj.frustumCulled = false; }
          });
          const holder = new THREE.Group();
          holder.add(root);
          const slot = (index % 6) - 2.5;
          holder.position.set(slot * 0.86, 0.18, -1.25 - Math.abs(slot) * 0.06);
          holder.rotation.y = 0;
          scene.add(holder);
          const mixer = new THREE.AnimationMixer(root);
          const actions = {};
          for (const clip of gltf.animations) {
            const action = mixer.clipAction(clip);
            action.clampWhenFinished = false;
            actions[clip.name] = action;
          }
          const idle = actions.idle || Object.values(actions)[0];
          if (idle) { idle.reset().setLoop(THREE.LoopRepeat, Infinity).play(); }
          // small varied pose offset
          root.position.y = 0;
          actors.push({ entry, holder, root, mixer, actions, current: idle });
          animations.set(entry.file, actions);
          // name plate
          const canvas = document.createElement('canvas'); canvas.width=256; canvas.height=64;
          const ctx=canvas.getContext('2d'); ctx.fillStyle='rgba(7,10,12,.72)'; ctx.beginPath(); ctx.roundRect(3,3,250,50,12); ctx.fill();
          ctx.strokeStyle='rgba(217,185,119,.35)'; ctx.lineWidth=2; ctx.stroke();
          ctx.fillStyle='rgba(244,236,221,.82)'; ctx.font='22px "Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(entry.name,128,29);
          const tex=new THREE.CanvasTexture(canvas); tex.colorSpace=THREE.SRGBColorSpace;
          const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
          sprite.scale.set(0.64,0.16,1); sprite.position.set(0,1.92,0); holder.add(sprite);
          resolve();
        }, undefined, () => resolve());
      });
    }

    function playForAll(name) {
      activeAction = name;
      for (const actor of actors) {
        const next = actor.actions[name];
        if (!next) continue;
        if (actor.current && actor.current !== next) {
          next.reset().setLoop(name === 'sit' ? THREE.LoopOnce : THREE.LoopRepeat, name === 'sit' ? 1 : Infinity).play();
          next.crossFadeFrom(actor.current, 0.22, false);
        } else if (!actor.current) {
          next.reset().setLoop(THREE.LoopRepeat, Infinity).play();
        } else {
          next.reset().setLoop(THREE.LoopRepeat, Infinity).play();
        }
        actor.current = next;
      }
      document.querySelectorAll('.controls button').forEach((b)=>b.classList.toggle('active', b.dataset.anim===name));
    }

    Promise.all(models.map(loadModel)).then(() => {
      document.getElementById('loading').classList.add('done');
      loader.load('/public/models/kenney/poker-props.glb', (gltf) => {
        const props = gltf.scene;
        props.scale.setScalar(1.4);
        props.position.set(0, 0.66, 0.02);
        props.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
        scene.add(props);
      });
      window.__characterLab = { actors, playForAll, models };
      // first actor waves after a beat
      setTimeout(()=>{ const a=actors[0]; if(a?.actions['emote-yes']){ a.actions['emote-yes'].reset().setLoop(THREE.LoopOnce,1).play(); } }, 700);
    });

    document.getElementById('controls').addEventListener('click', (e)=>{
      const btn=e.target.closest('button'); if(!btn) return;
      playForAll(btn.dataset.anim || 'idle');
    });

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      for (const actor of actors) actor.mixer.update(dt);
      const t = clock.elapsedTime;
      camera.position.x = Math.sin(t*0.08)*0.22;
      camera.position.z = 7.1 + Math.cos(t*0.08)*0.1;
      camera.lookAt(0, 1.02, -0.5);
      renderer.render(scene, camera);
    }
    animate();
    addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
