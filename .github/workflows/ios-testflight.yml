name: iOS TestFlight Upload

# Manual only: uploading a build to App Store Connect must never be a side
# effect of a normal push. Run from Actions -> "iOS TestFlight Upload".
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "HTTPS URL the app should load (for example https://game.example.com/play)"
        required: true
        default: ""
      build_number:
        description: "CFBundleVersion; leave empty to use the current Unix timestamp"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_URL: ${{ inputs.app_url }}
  IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.dezhounight.poker' }}
  IOS_PROFILE_SPECIFIER: ${{ vars.IOS_PROFILE_SPECIFIER }}

jobs:
  testflight:
    name: Archive, export App Store IPA, upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight (URL, signing and API-key secrets)
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_TEAM_ID IOS_BUNDLE_ID IOS_PROFILE_SPECIFIER; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing repository variable $name"; missing=1; fi
          done
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APPSTORE_PROFILE_BASE64 APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::app_url must start with https:// (WKWebView microphone requires a secure context)."; missing=1 ;;
          esac
          if [ "$missing" -ne 0 ]; then
            echo "TestFlight preflight failed. See ios/TESTFLIGHT.md for the secret names and how to create the App Store Connect API key."
            exit 1
          fi
          echo "Preflight OK: bundle=$IOS_BUNDLE_ID team=$IOS_TEAM_ID profile=$IOS_PROFILE_SPECIFIER"
          echo "App URL host: $(printf '%s' "$APP_URL" | sed -E 's#^https://([^/]+).*#\1#')"

      - name: Strip HTTP ATS exception for TestFlight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ios/project.yml')
          text = path.read_text(encoding='utf-8')
          block = "        NSAppTransportSecurity:\n          NSAllowsArbitraryLoads: true\n"
          if block not in text:
              raise SystemExit('ATS block not found; refusing to upload a build whose ATS policy changed unexpectedly')
          text = text.replace(block, "")
          path.write_text(text, encoding='utf-8')
          if 'NSAllowsArbitraryLoads' in path.read_text(encoding='utf-8'):
              raise SystemExit('NSAllowsArbitraryLoads still present')
          print('Removed NSAllowsArbitraryLoads: TestFlight build requires HTTPS')
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -list -project DezhouNight.xcodeproj

      - name: Import distribution certificate and App Store profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p build
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > build/dist-cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import build/dist-cert.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision" \
            > build/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' build/profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' build/profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' build/profile.plist || true

      - name: Archive with manual App Store signing
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="$(date +%s)"; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          cd ios
          xcodebuild \
            -project DezhouNight.xcodeproj \
            -scheme DezhouNight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/DezhouNight.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DZ_APP_URL="$APP_URL" \
            -quiet

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_SPECIFIER</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/DezhouNight.xcarchive \
            -exportPath build/testflight \
            -exportOptionsPlist build/ExportOptions.plist \
            -quiet
          ls -lh build/testflight
          IPA="$(find build/testflight -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect (TestFlight)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --verbose

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DezhouNight-testflight-${{ env.BUILD_NUMBER }}
          path: |
            build/testflight/*.ipa
            build/ExportOptions.plist
            build/DezhouNight.xcarchive
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS TestFlight upload"
            echo "- Bundle: \`$IOS_BUNDLE_ID\`"
            echo "- Team: \`$IOS_TEAM_ID\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- App URL host: \`$(printf '%s' "$APP_URL" | sed -E 's#^https://([^/]+).*#\1#')\`"
            echo "- Next: App Store Connect -> TestFlight -> select the build -> add testers."
            echo "- Builds expire after 90 days; internal testing does not need Beta App Review."
          } >> "$GITHUB_STEP_SUMMARY"
